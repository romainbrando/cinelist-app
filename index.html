  const allSeries = state.items.filter((it) => it.type === 'series');
  const allMovies = state.items.filter((it) => it.type === 'movie');
  let totalEpisodesWatched = 0, completedSeries = 0;
  allSeries.forEach((it) => {
    totalEpisodesWatched += seriesProgress(it).watched;
    if (seriesStatus(it) === 'watched' && (it.seasons || []).length > 0) completedSeries += 1;
  });
  const moviesWatched = allMovies.filter((it) => it.status === 'watched').length;
  const favoritesTotal = state.items.filter((it) => it.favorite).length;
  const unitsWatched = totalEpisodesWatched + moviesWatched;

  const tier = tierFor(unitsWatched);
  const next = nextTierFor(unitsWatched);

  return `
    <div style="text-align:center;padding:30px 10px 26px;">
      <div style="width:88px;height:88px;border-radius:50%;background:var(--bg-alt);border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:44px;margin:0 auto 14px;">${tier.emoji}</div>
      <div style="font-family:Georgia, serif;font-size:22px;color:var(--text);">${tier.title}</div>
      <div style="font-size:12.5px;color:var(--muted-dark);margin-top:4px;">${unitsWatched} épisode${unitsWatched>1?'s':''}/film${unitsWatched>1?'s':''} visionné${unitsWatched>1?'s':''} au total</div>
      ${next ? `<div style="font-size:11.5px;color:var(--gold);margin-top:8px;">Encore ${next.min - unitsWatched} pour devenir ${next.emoji} ${next.title}</div>` : `<div style="font-size:11.5px;color:var(--gold);margin-top:8px;">Rang maximum atteint ✓</div>`}
    </div>

    <div class="stats-grid" style="grid-template-columns: repeat(4, 1fr); margin-bottom: 22px;">
      <div class="stat-card"><div class="stat-num">${totalEpisodesWatched}</div><div class="stat-label">épisodes</div></div>
      <div class="stat-card"><div class="stat-num">${moviesWatched}</div><div class="stat-label">films</div></div>
      <div class="stat-card"><div class="stat-num">${completedSeries}</div><div class="stat-label">terminées</div></div>
      <div class="stat-card"><div class="stat-num">${favoritesTotal}</div><div class="stat-label">favoris</div></div>
    </div>

    <div style="background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px;margin-bottom:14px;">
      <div style="font-family:Georgia, serif;font-size:15px;margin-bottom:14px;">Apparence</div>
      <div style="display:flex;gap:8px;">
        <button class="chip ${state.theme==='dark'?'active':''}" style="flex:1;justify-content:center;padding:9px 0;" onclick="setTheme('dark')">🌙 Sombre</button>
        <button class="chip ${state.theme==='light'?'active':''}" style="flex:1;justify-content:center;padding:9px 0;" onclick="setTheme('light')">☀️ Clair</button>
        <button class="chip ${state.theme==='red'?'active':''}" style="flex:1;justify-content:center;padding:9px 0;" onclick="setTheme('red')">🔴 Rouge</button>
      </div>
    </div>

    <div style="background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px;">
      <div style="font-family:Georgia, serif;font-size:15px;margin-bottom:14px;">Compte</div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);">
        <div>
          <div style="font-size:13.5px;color:var(--text);">Clé API TMDB</div>
          <div style="font-size:11px;color:var(--muted-dark);margin-top:2px;">${state.apiKey ? 'Connectée' : 'Non renseignée'}</div>
        </div>
        <button class="ghost-btn" style="width:auto;padding:6px 14px;" onclick="openApiKeyPrompt()">${state.apiKey ? 'Modifier' : 'Ajouter'}</button>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;">
        <div style="font-size:13.5px;color:var(--text);">Titres suivis</div>
        <div style="font-size:13px;color:var(--muted-dark);">${state.items.length}</div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--border);">
        <div>
          <div style="font-size:13.5px;color:var(--text);">Exporter mes données</div>
          <div style="font-size:11px;color:var(--muted-dark);margin-top:2px;">Pour sauvegarder ou partager ta liste</div>
        </div>
        <button class="ghost-btn" style="width:auto;padding:6px 14px;" onclick="exportData()">Exporter</button>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--border);">
        <div>
          <div style="font-size:13.5px;color:var(--text);">Importer une liste</div>
          <div style="font-size:11px;color:var(--muted-dark);margin-top:2px;">Charger un export depuis un autre appareil (remplace la liste actuelle ici)</div>
        </div>
        <button class="ghost-btn" style="width:auto;padding:6px 14px;" onclick="triggerImport()">Importer</button>
        <input type="file" id="import-file-input" accept=".json" style="display:none;" onchange="importDataFile(event)" />
      </div>
      <div style="padding:8px 0;border-top:1px solid var(--border);">
        <button onclick="toggleImportPaste()" style="background:none;border:none;color:var(--muted-dark);font-size:11px;text-decoration:underline;cursor:pointer;padding:0;">
          ${state.showImportPaste ? 'Masquer' : "Le sélecteur de fichier ne marche pas ? Colle le contenu ici"}
        </button>
        ${state.showImportPaste ? `
          <textarea id="import-paste-area" rows="4" placeholder="Colle ici le contenu du fichier cinelist-export.json" style="width:100%;margin-top:8px;padding:9px 11px;border-radius:8px;border:1px solid var(--border);background:var(--bg-alt);color:var(--text);font-size:12px;resize:vertical;"></textarea>
          <button class="primary-btn" style="margin-top:8px;" onclick="importDataText()">Importer ce texte</button>
        ` : ''}
      </div>
    </div>
  `;
}

function sortItems(items) {
  const arr = [...items];
  if (state.sortOrder === 'alpha') {
    arr.sort((a, b) => a.title.localeCompare(b.title, 'fr'));
  } else if (state.sortOrder === 'recent') {
    arr.sort((a, b) => (b.lastWatchedAt || 0) - (a.lastWatchedAt || 0));
  } else {
    arr.sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0));
  }
  return arr;
}

function applyLayoutMode() {
  const isMobile = state.displayMode === 'mobile' ? true
    : state.displayMode === 'web' ? false
    : window.innerWidth <= 720;
  document.body.classList.toggle('layout-mobile', isMobile);
  document.body.classList.toggle('mobile-search-open', !!state.mobileSearchOpen);
}
window.toggleMobileSearch = () => {
  state.mobileSearchOpen = !state.mobileSearchOpen;
  if (state.mobileSearchOpen) {
    state.mobilePrevTab = state.tab;
    state.tab = 'suggestions';
    ensureSuggestionsLoaded();
  } else {
    state.tab = state.mobilePrevTab || 'series';
    state.query = '';
    state.mainSuggestions = [];
  }
  render();
  if (state.mobileSearchOpen) {
    setTimeout(() => { const el = document.getElementById('main-search-input'); if (el) el.focus(); }, 50);
  }
};
window.setDisplayMode = (v) => {
  state.displayMode = v;
  localStorage.setItem(LS_DISPLAY_MODE, v);
  applyLayoutMode();
  render();
};
window.addEventListener('resize', () => {
  if (state.displayMode === 'auto') applyLayoutMode();
});

function render() {
  applyLayoutMode();
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;

  const dropdownScrolls = {};
  document.querySelectorAll('.season-dropdown[id], #detail-modal-scroll').forEach((el) => { dropdownScrolls[el.id] = el.scrollTop; });

  const isStats = state.tab === 'stats';
  const isProfile = state.tab === 'profile';
  const isSettings = state.tab === 'settings';
  const isSuggestions = state.tab === 'suggestions';
  const isList = !isStats && !isProfile && !isSettings && !isSuggestions;
  const tabItems = !isList ? [] : state.items.filter((it) => it.type === state.tab);
  const filtered = sortItems(tabItems.filter((it) => {
    if (state.query.trim() && !it.title.toLowerCase().includes(state.query.trim().toLowerCase())) return false;
    if (state.statusFilter === 'favorite') return !!it.favorite;
    if (state.statusFilter === 'all') return true;
    return effectiveStatus(it) === state.statusFilter;
  }));
  const counts = { to_watch: 0, watching: 0, watched: 0, favorite: 0 };
  tabItems.forEach((it) => {
    const s = effectiveStatus(it);
    counts[s] = (counts[s]||0)+1;
    if (it.favorite) counts.favorite++;
  });
  const statusMeta = state.tab === 'movie' ? FILM_STATUS : SERIES_STATUS;
  const movieCount = state.items.filter((i)=>i.type==='movie').length;
  const seriesCount = state.items.filter((i)=>i.type==='series').length;

  const chipHtml = (key, m) => `
    <button class="chip ${state.statusFilter===key?'active':''}" style="${state.statusFilter===key?`border-color:${m.color};color:${m.color};background:${m.color}18;`:''}"
      onclick="setStatusFilter('${key}')">${m.label} (${counts[key]||0})</button>
  `;

  let statusChips = '';
  if (state.tab === 'series') {
    statusChips = chipHtml('watching', SERIES_STATUS.watching) + chipHtml('to_watch', SERIES_STATUS.to_watch) + chipHtml('watched', SERIES_STATUS.watched);
  } else if (state.tab === 'movie') {
    statusChips = Object.entries(statusMeta).map(([key, m]) => chipHtml(key, m)).join('');
  }

  const TOP_TABS = ['settings', 'stats', 'profile'];
  const TYPE_TABS = ['series', 'movie'];
  const MOBILE_STATUS_ICONS = state.tab === 'movie' ? [
    { key: 'to_watch', icon: '📥', label: 'À voir' },
    { key: 'watched', icon: '✅', label: 'Terminé' },
    { key: 'favorite', icon: '♥', label: 'Favoris' },
  ] : [
    { key: 'watching', icon: '▶️', label: 'En cours' },
    { key: 'to_watch', icon: '📥', label: 'À voir' },
    { key: 'watched', icon: '✅', label: 'Terminé' },
    { key: 'favorite', icon: '♥', label: 'Favoris' },
  ];
  const mobileBottomBarHtml = MOBILE_STATUS_ICONS.map((s) => {
    return `<button class="mobile-nav-icon mobile-nav-icon-lg ${state.statusFilter===s.key?'active':''}" onclick="setMobileStatusFilter('${s.key}')" title="${s.label}">${s.icon}</button>`;
  }).join('') + `<button class="mobile-nav-icon mobile-nav-icon-lg ${state.mobileSearchOpen?'active':''}" onclick="toggleMobileSearch()" title="Rechercher">🔍</button>`;
  const mobileTopBarHtml = TOP_TABS.map((key) => {
    const m = TAB_META[key];
    return `<button class="mobile-nav-icon ${state.tab===key?'active':''}" onclick="setTab('${key}')" title="${m.label}">${m.icon}</button>`;
  }).join('');
  const typeSegmentedHtml = TYPE_TABS.map((key) => {
    const m = TAB_META[key];
    return `<button class="type-segment ${state.tab===key?'active':''}" onclick="setTab('${key}')">${m.icon} ${m.label}</button>`;
  }).join('');

  let mainContent;
  if (isStats) {
    mainContent = statsHtml();
  } else if (isProfile) {
    mainContent = profileHtml();
  } else if (isSettings) {
    mainContent = settingsHtml();
  } else if (isSuggestions) {
    const searchBar = `
      <div class="search-row">
        <div class="search-box"><input id="main-search-input" placeholder="Rechercher un film ou une série..." value="${esc(state.query)}" oninput="setQuery(this.value)" />${state.query ? `<button class="search-clear-btn" onclick="clearSearchQuery()" title="Effacer">✕</button>` : ""}</div>
        ${mainSuggestDropdownHtml()}
      </div>
    `;
    mainContent = searchBar + suggestionsHtml();
  } else {
    mainContent = `
      <div class="type-segmented">${typeSegmentedHtml}</div>

      <div class="search-row">
        <div class="search-box"><input id="main-search-input" placeholder="${state.tab==='movie'?'Rechercher un film...':'Rechercher une série...'}" value="${esc(state.query)}" oninput="setQuery(this.value)" />${state.query ? `<button class="search-clear-btn" onclick="clearSearchQuery()" title="Effacer">✕</button>` : ""}</div>
        <button class="btn-gold" onclick="openAdd()">+ Ajouter</button>
        ${mainSuggestDropdownHtml()}
      </div>

      <div class="filters">
        <button class="chip ${state.statusFilter==='all'?'active':''}" onclick="setStatusFilter('all')">Tous statuts</button>
        ${statusChips}
        <button class="chip fav ${state.statusFilter==='favorite'?'active':''}" onclick="setStatusFilter('favorite')">♥ Favoris (${counts.favorite||0})</button>
      </div>

      ${filtered.length === 0
        ? `<div class="empty"><div class="t">Écran vide</div><div>Rien ici pour l'instant — ajoute ${state.tab==='movie'?'un film':'une série'} ou change les filtres.</div></div>`
        : `<div class="grid ${state.compactView?'compact':''}">${filtered.map(ticketHtml).join('')}</div>`
      }
    `;
  }

  const navHtml = NAV_ORDER.map((key) => {
    const m = TAB_META[key];
    const count = key === 'movie' ? ` (${movieCount})` : key === 'series' ? ` (${seriesCount})` : '';
    return `<button class="side-nav-item ${state.tab===key?'active':''}" onclick="setTab('${key}')"><span class="ico">${m.icon}</span>${m.label}${count}</button>`;
  }).join('');

  const pageSub = (isProfile || isSettings) ? ''
    : isStats ? 'Ce que tu as regardé, en un coup d\'œil'
    : isSuggestions ? 'Des idées à ajouter en un clic'
    : `${state.items.length} titres au total · <a href="#" onclick="event.preventDefault(); openApiKeyPrompt()" style="color:var(--muted-dark);">${state.apiKey ? 'Clé TMDB connectée' : 'Ajouter une clé TMDB'}</a>`;

  let html = `
    <div class="app-shell">
      <div class="sidebar">
        <div class="sidebar-brand"><span class="icon">✓</span><span class="name">CinéList</span></div>
        ${navHtml}
      </div>
      <div class="mobile-topbar">${mobileTopBarHtml}</div>
      <div class="mobile-bottombar">${mobileBottomBarHtml}</div>
      <div class="main-content">
        <div class="wrap" style="margin:0;max-width:900px;">
          <h1 class="page-title">${TAB_META[state.tab].title}</h1>
          ${pageSub ? `<div class="page-sub">${pageSub}</div>` : ''}

          ${mainContent}

          <div class="footer-credit">Données et affiches fournies par TMDB — ce produit n'est ni approuvé ni certifié par TMDB.</div>
        </div>
      </div>
    </div>
  `;

  if (state.showAdd) html += addModalHtml();
  if (state.detailItemId) html += detailModalHtml(findItem(state.detailItemId));
  if (state.reviewItemId) html += reviewModalHtml(findItem(state.reviewItemId));
  if (state.actorModal) html += actorModalHtml(state.actorModal);
  if (state.collectionOffer) html += collectionOfferModalHtml(state.collectionOffer);

  document.getElementById('app').innerHTML = html;
  bindRatingSetters();

  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) {
      el.focus();
      if (selStart !== null && el.setSelectionRange) {
        try { el.setSelectionRange(selStart, selEnd); } catch (e) { /* ignore */ }
      }
    }
  }

  Object.keys(dropdownScrolls).forEach((id) => {
    const el = document.getElementById(id);
    if (el) el.scrollTop = dropdownScrolls[id];
  });
}

function addModalHtml() {
  const results = state.addResults.map((r) => {
    const title = state.tab === 'movie' ? r.title : r.name;
    const date = state.tab === 'movie' ? r.release_date : r.first_air_date;
    const year = (date || '').slice(0,4);
    const poster = r.poster_path ? `<img src="${TMDB_IMG}${r.poster_path}" />` : `<div class="ph"></div>`;
    return `<div class="search-result" onclick="pickAddResult(${r.id})">${poster}<div class="info"><div class="st">${esc(title)}</div><div class="sy">${year}</div></div></div>`;
  }).join('');

  let preview = '';
  if (state.addSelected) {
    const n = state.addSelected;
    preview = `
      <div style="display:flex;gap:12px;margin-bottom:16px;">
        ${n.posterPath ? `<img src="${TMDB_IMG}${n.posterPath}" style="width:70px;border-radius:8px;" />` : ''}
        <div>
          <div style="font-family:Georgia, serif; font-size:16px;">${esc(n.title)}</div>
          <div style="font-size:12px;color:var(--muted-dark);">${n.year||''}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:6px;">${esc((n.synopsis||'').slice(0,140))}${n.synopsis && n.synopsis.length>140 ? '…':''}</div>
        </div>
      </div>
      <button class="primary-btn" onclick="confirmAddSelected()">Ajouter à ma liste</button>
    `;
  }

  return `<div class="overlay" onclick="closeAdd()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-pad">
        <div class="modal-head">
          <span class="modal-title">Ajouter ${state.tab==='movie'?'un film':'une série'}</span>
          <button class="x-btn" onclick="closeAdd()">✕</button>
        </div>
        <div class="search-box" style="margin-bottom:10px;">
          <input id="add-query-input" placeholder="Titre à rechercher sur TMDB..." value="${esc(state.addQuery)}" oninput="setAddQuery(this.value)"
            onkeydown="if(event.key==='Enter') runAddSearch()" />
        </div>
        <button class="primary-btn" style="margin-bottom:14px;" onclick="runAddSearch()" ${state.addSearching?'disabled':''}>
          ${state.addSearching ? 'Recherche...' : 'Rechercher sur TMDB'}
        </button>

        ${preview}
        ${!state.addSelected && results ? `<div style="display:flex;flex-direction:column;gap:4px;margin-bottom:14px;">${results}</div>` : ''}

        ${!state.addSelected ? `
          <div style="border-top:1px solid var(--border); padding-top:12px; margin-top:4px;">
            <div style="font-size:11.5px;color:var(--muted-dark);margin-bottom:8px;">Le titre n'apparaît pas ? Ajoute-le manuellement, sans fiche TMDB.</div>
            <button class="ghost-btn" style="width:100%;" onclick="addManually()">Ajouter "${esc(state.addQuery)||'...'}" manuellement</button>
          </div>
        ` : ''}
      </div>
    </div>
  </div>`;
}

function reviewModalHtml(item) {
  return `<div class="overlay" onclick="closeReview()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-pad">
        <div class="modal-head"><span class="modal-title">${esc(item.title)}</span><button class="x-btn" onclick="closeReview()">✕</button></div>
        <div style="margin-bottom:14px;">${starsHtml(item.rating, `setRating_${item.id}`, 20, item.id)}</div>
        <textarea id="review-textarea" class="field" rows="5" placeholder="Ton avis, ce que tu en as retenu...">${esc(item.review)}</textarea>
        <button class="primary-btn" onclick="saveReview('${item.id}')">Enregistrer</button>
      </div>
    </div>
  </div>`;
}

function episodeRowsHtml(item, seasonIdx, season) {
  const cacheKey = item.tmdbId ? `${item.tmdbId}:${season.number}` : null;
  const cached = cacheKey ? EPISODE_CACHE[cacheKey] : null;

  if (cached === 'loading') {
    return `<div style="padding:10px 4px;font-size:12px;color:var(--muted-dark);">Chargement des épisodes...</div>`;
  }

  if (Array.isArray(cached)) {
    return `<div style="display:flex;flex-direction:column;gap:4px;margin-top:6px;">` + season.episodes.map((watched, epIdx) => {
      const meta = cached.find((e) => e.number === epIdx + 1) || {};
      const thumb = meta.still
        ? `<img class="episode-thumb" src="${TMDB_IMG_STILL}${meta.still}" alt="" />`
        : `<div class="episode-thumb" style="display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted-dark);">${epIdx+1}</div>`;
      const overviewKey = `${item.id}:${season.number}:${epIdx}`;
      const overviewExpanded = !!state.expandedOverviews[overviewKey];
      const overviewText = esc(meta.overview) || (meta.airDate ? formatDateFr(meta.airDate) : '');
      const hasOverview = !!meta.overview;
      const overviewStyle = overviewExpanded
        ? 'white-space:normal;overflow:visible;'
        : 'white-space:nowrap;overflow:hidden;text-overflow:ellipsis;';
      return `<div class="episode-row" style="${hasOverview?'cursor:pointer;':''}" ${hasOverview ? `onclick="toggleEpisodeOverview('${overviewKey}')"` : ''}>
        ${thumb}
        <div class="episode-info">
          <div class="episode-title">${epIdx+1}. ${esc(meta.title || `Épisode ${epIdx+1}`)}</div>
          <div class="episode-overview" style="${overviewStyle}">${overviewText}</div>
        </div>
        <button class="episode-check ${watched?'watched':''}" onclick="event.stopPropagation(); toggleEpisode('${item.id}',${seasonIdx},${epIdx})" title="${watched?'Vu':'Marquer comme vu'}">
          ${watched ? `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--bg)" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>` : ''}
        </button>
      </div>`;
    }).join('') + `</div>`;
  }

  // Fallback: simple numbered grid (no TMDB episode data available)
  return `<div class="ep-grid">` + season.episodes.map((w, epIdx) =>
    `<button class="ep-btn ${w?'watched':''}" onclick="event.stopPropagation(); toggleEpisode('${item.id}',${seasonIdx},${epIdx})" title="Épisode ${epIdx+1}">${epIdx+1}</button>`
  ).join('') + `</div>`;
}

function seasonsEditorHtml(item) {
  const seasons = item.seasons || [];
  const rows = seasons.map((s, idx) => {
    const sp = seasonProgress(s);
    const spct = sp.total > 0 ? Math.round((sp.watched / sp.total) * 100) : 0;
    const expanded = !!((state.expandedSeasons[item.id] || {})[idx]);
    const epGrid = expanded ? episodeRowsHtml(item, idx, s) : '';
    return `<div id="season-block-${item.id}-${idx}" style="padding:6px 0;border-bottom:1px solid var(--border);">
      <div style="display:flex;align-items:center;gap:8px;cursor:pointer;" onclick="toggleSeasonExpand('${item.id}',${idx})">
        <span style="font-size:12px;color:var(--muted-dark);">${expanded?'▾':'▸'}</span>
        <span style="font-size:13px;flex:1;">Saison ${s.number}</span>
        <div class="season-bar" style="width:60px;height:4px;background:var(--bg-alt);"><div class="season-bar-fill" style="width:${spct}%"></div></div>
        <span style="font-size:11px;color:var(--muted-dark);white-space:nowrap;">${sp.watched}/${sp.total}</span>
        <button class="season-del-btn" onclick="event.stopPropagation(); deleteSeason('${item.id}',${idx})" title="Supprimer cette saison">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--muted-dark)" stroke-width="2">
            <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
          </svg>
        </button>
      </div>
      ${epGrid}
    </div>`;
  }).join('');

  let upcomingRow = '';
  if (item.tmdbId && isSeriesOngoing(item)) {
    const up = UPCOMING_SEASON_CACHE[item.tmdbId];
    if (up === 'loading') {
      upcomingRow = `<div style="padding:8px 0;font-size:12px;color:var(--muted-dark);">Vérification d'une nouvelle saison...</div>`;
    } else if (up && up !== 'error' && up !== 'none') {
      const upEpisodes = (up.episodes || []).filter((e) => e.airDate);
      const episodesList = upEpisodes.length ? `
        <div style="margin-top:8px;display:flex;flex-direction:column;gap:6px;">
          ${upEpisodes.map((e) => `
            <div style="display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:6px 8px;background:var(--bg-alt);border-radius:8px;">
              <span style="color:var(--text);">${e.number}. ${esc(e.title || `Épisode ${e.number}`)}</span>
              <span style="color:var(--muted-dark);white-space:nowrap;">${formatDateFr(e.airDate)}</span>
            </div>
          `).join('')}
        </div>` : '';
      upcomingRow = `<div style="padding:8px 0;border-bottom:1px solid var(--border);">
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="font-size:13px;flex:1;">Saison ${up.seasonNumber}</span>
          <span style="font-size:11px;color:var(--gold);font-weight:600;">${up.airDate ? `Diffusion prévue le ${formatDateFr(up.airDate)}` : 'En production'}</span>
        </div>
        ${episodesList}
      </div>`;
    }
  }

  return `
    <div style="margin-bottom:18px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <div style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);">Saisons</div>
        ${item.tmdbId ? `<button class="ghost-btn" style="width:auto;padding:4px 10px;font-size:11px;" onclick="refreshFromTmdb('${item.id}')">Actualiser depuis TMDB</button>` : ''}
      </div>
      ${rows || `<div style="font-size:12.5px;color:var(--muted-dark);">Aucune saison ajoutée. ${item.tmdbId ? 'Clique sur "Actualiser depuis TMDB" pour les récupérer.' : ''}</div>`}
      ${upcomingRow}
      ${seasons.length ? `<button class="ghost-btn" style="width:100%;margin-top:10px;" onclick="markAllWatched('${item.id}')">✓ Tout marquer comme vu</button>` : ''}
    </div>
  `;
}

function formatDateFr(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d)) return dateStr;
  return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
}

function cinemaBlockHtml(releaseDate) {
  return `<div style="margin-bottom:18px;">
    <div style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin-bottom:8px;">Où regarder</div>
    <div style="font-size:13px;color:var(--text);">🎬 Sortie au cinéma le ${formatDateFr(releaseDate)}</div>
  </div>`;
}

function providersHtml(item) {
  const isMovie = item.type === 'movie';
  const upcoming = isMovie && isUpcomingMovie(item);
  if (upcoming) {
    return item.releaseDate ? cinemaBlockHtml(item.releaseDate) : '';
  }

  if (!item.tmdbId) return '';
  const key = `${item.type}:${item.tmdbId}`;
  const data = PROVIDERS_CACHE[key];
  if (data === 'loading') {
    return `<div style="margin-bottom:18px;"><div style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin-bottom:8px;">Où regarder</div><div style="font-size:12px;color:var(--muted-dark);">Chargement...</div></div>`;
  }
  if (!data || data === 'error') return '';

  const hasAny = data !== 'none' && ((data.flatrate||[]).length || (data.rent||[]).length || (data.buy||[]).length);
  if (!hasAny) return '';

  const chip = (p) => `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;width:56px;flex-shrink:0;">
    ${p.logo_path ? `<img src="https://image.tmdb.org/t/p/w92${p.logo_path}" style="width:40px;height:40px;border-radius:10px;object-fit:cover;" />` : `<div style="width:40px;height:40px;border-radius:10px;background:var(--bg-alt);"></div>`}
    <span style="font-size:9.5px;color:var(--muted-dark);text-align:center;line-height:1.2;">${esc(p.provider_name)}</span>
  </div>`;

  const groups = [
    { list: data.flatrate, label: 'Streaming' },
    { list: data.rent, label: 'Location' },
    { list: data.buy, label: 'Achat' },
  ].filter((g) => g.list && g.list.length);

  if (!groups.length) return '';

  const filterActive = state.selectedProviderIds.length > 0;
  const showAll = !!state.showAllProviders[item.id];
  const visibleGroups = (filterActive && !showAll)
    ? groups.map((g) => ({ ...g, list: g.list.filter((p) => state.selectedProviderIds.includes(p.provider_id)) })).filter((g) => g.list.length)
    : groups;

  if (filterActive && !showAll && !visibleGroups.length) {
    return `<div style="margin-bottom:18px;">
      <div style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin-bottom:8px;">Où regarder</div>
      <div style="font-size:12.5px;color:var(--muted-dark);margin-bottom:10px;">Pas disponible sur tes plateformes.</div>
      <button class="ghost-btn" style="width:auto;padding:6px 14px;" onclick="showAllProvidersFor('${item.id}')">Autres plateformes</button>
    </div>`;
  }

  const sections = visibleGroups.map((g) => `
    <div style="margin-bottom:8px;">
      <div style="font-size:10px;color:var(--muted-dark);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">${g.label}</div>
      <div style="display:flex;gap:10px;overflow-x:auto;padding-bottom:2px;">${g.list.map(chip).join('')}</div>
    </div>
  `).join('');

  return `
    <div style="margin-bottom:18px;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;">
        <div style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);">Où regarder</div>
        <span style="font-size:9px;color:var(--muted-dark);">Données JustWatch</span>
      </div>
      ${sections}
    </div>
  `;
}

function postersPickerHtml(item) {
  if (!item.tmdbId) return '';
  const key = `${item.type}:${item.tmdbId}`;
  const data = POSTERS_CACHE[key];
  if (data === 'loading') {
    return `<div style="margin-bottom:18px;"><div style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin-bottom:8px;">Affiche</div><div style="font-size:12px;color:var(--muted-dark);">Chargement...</div></div>`;
  }
  if (!Array.isArray(data) || data.length < 2) return '';

  const thumbs = data.map((filePath) => {
    const active = filePath === item.posterPath;
    return `<button onclick="setPoster('${item.id}','${filePath}')" style="flex-shrink:0;padding:0;border-radius:8px;border:2px solid ${active?'var(--gold)':'transparent'};cursor:pointer;overflow:hidden;background:none;">
      <img src="${TMDB_IMG}${filePath}" style="width:56px;height:84px;object-fit:cover;display:block;" />
    </button>`;
  }).join('');

  return `
    <div style="margin-bottom:18px;">
      <div style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin-bottom:8px;">Affiche</div>
      <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;">${thumbs}</div>
    </div>
  `;
}

function castSectionHtml(castArr) {
  if (!Array.isArray(castArr) || !castArr.length) return '';
  const thumbs = castArr.map((actor) => {
    ACTOR_REGISTRY[actor.id] = { name: actor.name, profilePath: actor.profilePath };
    const img = actor.profilePath
      ? `<img src="${TMDB_IMG_PROFILE}${actor.profilePath}" style="width:100%;height:100%;object-fit:cover;" />`
      : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--muted-dark);background:var(--bg-alt);">${esc(initials(actor.name))}</div>`;
    return `<button onclick="openActor(${actor.id})" style="display:flex;flex-direction:column;align-items:center;gap:5px;width:62px;flex-shrink:0;background:none;border:none;cursor:pointer;padding:0;">
      <div style="width:50px;height:50px;border-radius:50%;overflow:hidden;border:1px solid var(--border);">${img}</div>
      <span style="font-size:10px;color:var(--text);text-align:center;line-height:1.2;">${esc(actor.name)}</span>
    </button>`;
  }).join('');
  return `
    <div style="margin-bottom:18px;">
      <div style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin-bottom:10px;">Distribution</div>
      <div style="display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;">${thumbs}</div>
    </div>
  `;
}

function actorEntryHtml(e) {
  const year = (e.date || '').slice(0, 4);
  const poster = e.poster ? `<img src="${TMDB_IMG}${e.poster}" />` : `<div class="ph"></div>`;
  return `<div class="search-result" style="cursor:default;">${poster}<div class="info"><div class="st">${esc(e.title)}</div><div class="sy">${year}</div></div></div>`;
}


function collectionOfferModalHtml(offer) {
  const rows = offer.movies.map((m) => `
    <label style="display:flex;align-items:center;gap:10px;padding:8px 4px;cursor:pointer;border-bottom:1px solid var(--border);">
      <input type="checkbox" ${m.selected?'checked':''} onchange="toggleCollectionMovie(${m.id})" style="width:17px;height:17px;flex-shrink:0;accent-color:var(--gold);" />
      ${m.posterPath
        ? `<img src="${TMDB_IMG}${m.posterPath}" style="width:36px;height:54px;object-fit:cover;border-radius:6px;flex-shrink:0;" />`
        : `<div style="width:36px;height:54px;background:var(--bg-alt);border-radius:6px;flex-shrink:0;"></div>`}
      <div style="flex:1;min-width:0;">
        <div style="font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(m.title)}</div>
        <div style="font-size:11px;color:var(--muted-dark);">${esc(m.year)}</div>
      </div>
    </label>
  `).join('');
  const selectedCount = offer.movies.filter((m) => m.selected).length;
  return `<div class="overlay" onclick="closeCollectionOffer()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-pad">
        <div style="font-family:Georgia, serif;font-size:18px;margin-bottom:4px;">${esc(offer.name)}</div>
        <div style="font-size:12px;color:var(--muted-dark);margin-bottom:16px;">"${esc(offer.sourceTitle)}" fait partie de cette saga — choisis les films à ajouter.</div>
        <div style="max-height:50vh;overflow-y:auto;margin-bottom:16px;">${rows}</div>
        <div style="display:flex;gap:8px;">
          <button class="ghost-btn" style="flex:1;" onclick="closeCollectionOffer()">Annuler</button>
          <button class="primary-btn" style="flex:2;" ${selectedCount===0?'disabled':''} onclick="confirmCollectionAdd()">Ajouter la sélection (${selectedCount})</button>
        </div>
      </div>
    </div>
  </div>`;
}

function actorModalHtml(m) {
  const photo = m.profilePath
    ? `<img src="${TMDB_IMG_PROFILE}${m.profilePath}" style="width:100%;height:100%;object-fit:cover;" />`
    : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--muted-dark);background:var(--bg-alt);">${esc(initials(m.name||'?'))}</div>`;
  let content;
  if (m.loading) {
    content = `<div style="padding:20px 0;text-align:center;color:var(--muted-dark);font-size:13px;">Chargement...</div>`;
  } else if (m.error) {
    content = `<div style="padding:20px 0;text-align:center;color:var(--burgundy-light);font-size:13px;">${esc(m.error)}</div>`;
  } else {
    const movies = m.movies.slice(0, 12).map(actorEntryHtml).join('') || `<div style="font-size:12.5px;color:var(--muted-dark);">Aucun film trouvé.</div>`;
    const series = m.series.slice(0, 12).map(actorEntryHtml).join('') || `<div style="font-size:12.5px;color:var(--muted-dark);">Aucune série trouvée.</div>`;
    content = `
      <div style="margin-bottom:16px;">
        <div style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin-bottom:8px;">Filmographie</div>
        <div style="display:flex;flex-direction:column;gap:2px;">${movies}</div>
      </div>
      <div>
        <div style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin-bottom:8px;">Sérigraphie</div>
        <div style="display:flex;flex-direction:column;gap:2px;">${series}</div>
      </div>
    `;
  }
  return `<div class="overlay" onclick="closeActor()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-pad">
        <div class="modal-head">
          <div style="display:flex;align-items:center;gap:12px;">
            <div style="width:44px;height:44px;border-radius:50%;overflow:hidden;flex-shrink:0;border:1px solid var(--border);">${photo}</div>
            <span class="modal-title">${esc(m.name)}</span>
          </div>
          <button class="x-btn" onclick="closeActor()">✕</button>
        </div>
        ${content}
      </div>
    </div>
  </div>`;
}

function trailerTabHtml(item) {
  if (!item.tmdbId) {
    return `<div style="font-size:12.5px;color:var(--muted-dark);padding:10px 0;">Pas de bande-annonce disponible pour ce titre ajouté manuellement.</div>`;
  }
  const key = `${item.type}:${item.tmdbId}`;
  const data = TRAILER_CACHE[key];
  if (data === 'loading' || data === undefined) {
    return `<div style="font-size:12.5px;color:var(--muted-dark);padding:10px 0;">Chargement de la bande-annonce...</div>`;
  }
  if (!data || data === 'error' || data === 'none') {
    return `<div style="font-size:12.5px;color:var(--muted-dark);padding:10px 0;">Aucune bande-annonce trouvée.</div>`;
  }
  return `<a href="https://www.youtube.com/watch?v=${data.key}" target="_blank" rel="noopener noreferrer" style="display:block;position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:10px;background:var(--bg-alt);text-decoration:none;">
    <img src="https://img.youtube.com/vi/${data.key}/hqdefault.jpg" alt="${esc(data.name||'Bande annonce')}" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;" />
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(18,16,26,0.25);">
      <div style="width:56px;height:56px;border-radius:50%;background:rgba(18,16,26,0.7);border:2px solid rgba(245,241,232,0.8);display:flex;align-items:center;justify-content:center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="var(--text)"><polygon points="6 4 20 12 6 20"/></svg>
      </div>
    </div>
    <div style="position:absolute;bottom:0;left:0;right:0;background:rgba(18,16,26,0.75);color:var(--text);font-size:11.5px;padding:6px 10px;">▶ Regarder sur YouTube — ${esc(data.name||'Bande annonce')}</div>
  </a>`;
}

function detailModalHtml(item) {
  const isSeries = item.type === 'series';
  const fields = [
    { key: 'director', label: isSeries ? 'Créateur' : 'Réalisateur' },
    { key: 'studio', label: isSeries ? 'Chaîne / Plateforme' : 'Studio' },
    { key: 'country', label: 'Pays' },
    { key: 'genre', label: 'Genre' },
  ];
  if (!isSeries) fields.push({ key: 'releaseDate', label: 'Date de sortie', formatted: true });
  if (isSeries) fields.push({ key: 'tmdbStatus', label: 'Statut TMDB (diagnostic)' });

  const tabs = isSeries ? ['episodes', 'details', 'trailer'] : ['details', 'trailer'];
  const tabLabels = { episodes: 'Épisodes', details: 'Détails', trailer: 'Bande annonce' };
  const activeTab = tabs.includes(state.detailTab) ? state.detailTab : tabs[0];

  const tabNav = `<div style="display:flex;gap:6px;margin-bottom:16px;">` + tabs.map((t) => `
    <button onclick="setDetailTab('${t}')" style="flex:1;padding:8px 4px;border-radius:8px;border:1px solid ${activeTab===t?'var(--gold)':'var(--border)'};background:${activeTab===t?'rgba(232,179,76,0.12)':'none'};color:${activeTab===t?'var(--gold)':'var(--muted)'};font-size:12px;font-weight:${activeTab===t?'600':'400'};cursor:pointer;">${tabLabels[t]}</button>
  `).join('') + `</div>`;

  let tabContent;
  if (activeTab === 'episodes') {
    tabContent = seasonsEditorHtml(item);
  } else if (activeTab === 'trailer') {
    tabContent = trailerTabHtml(item);
  } else {
    tabContent = `
      <div style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin-bottom:6px;">Synopsis</div>
      <div style="font-size:13.5px;color:${item.synopsis?'var(--text)':'var(--muted-dark)'};line-height:1.5;margin-bottom:18px;">${esc(item.synopsis)||'Pas encore de synopsis renseigné.'}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;">
        ${fields.map((f) => `<div><div style="font-size:10.5px;letter-spacing:0.5px;text-transform:uppercase;color:var(--muted-dark);margin-bottom:3px;">${f.label}</div><div style="font-size:13px;color:${item[f.key]?'var(--text)':'var(--muted-dark)'};">${esc(f.formatted ? formatDateFr(item[f.key]) : item[f.key])||'—'}</div></div>`).join('')}
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px;padding:12px 14px;background:var(--bg-alt);border-radius:12px;">
        <div>
          <div style="font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin-bottom:6px;">Note</div>
          ${starsHtml(item.rating, `setRating_${item.id}`, 20, item.id)}
        </div>
        <button onclick="openReview('${item.id}')" style="font-size:11px;white-space:nowrap;color:${item.review?'var(--gold)':'var(--muted-dark)'};background:none;border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;">${item.review?'Voir la note':'Ajouter une note'}</button>
      </div>
      ${castSectionHtml(item.cast)}
      ${providersHtml(item)}
      ${postersPickerHtml(item)}
      <button class="ghost-btn" style="width:100%;color:var(--burgundy-light);border-color:var(--burgundy-light);" onclick="deleteItem('${item.id}')">Supprimer ce titre</button>
    `;
  }

  return `<div class="overlay" onclick="closeDetail()">
    <div class="modal" id="detail-modal-scroll" onclick="event.stopPropagation()" ontouchstart="swStart(event)" ontouchmove="swMove(event)" ontouchend="swEnd(event)" onmousedown="swStart(event)" onmousemove="swMove(event)" onmouseup="swEnd(event)">
      <div style="position:relative;">
        ${posterHtml(item, { withHeart: false, movieMarkId: item.type==='movie' ? item.id : null, movieWatched: item.status==='watched' })}
        <button class="x-btn" style="position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:rgba(18,16,26,0.7);display:flex;align-items:center;justify-content:center;" onclick="closeDetail()">✕</button>
      </div>
      <div class="modal-pad">
        <div style="font-family:Georgia, serif; font-size:19px; margin-bottom:2px;">${esc(item.title)}</div>
        <div style="font-size:12.5px;color:var(--muted-dark);margin-bottom:16px;">${item.year||''}</div>
        ${tabNav}
        ${tabContent}
      </div>
    </div>
  </div>`;
}

document.addEventListener('click', () => {
  if (Object.values(state.seasonsOpen).some(Boolean)) {
    state.seasonsOpen = {};
    render();
  }
});

/* ---------- Init ---------- */
document.body.classList.toggle('theme-light', state.theme === 'light');
document.body.classList.toggle('theme-red', state.theme === 'red');
if (!state.apiKey) {
  document.getElementById('app').innerHTML = `
    <div class="apikey-screen">
      <div class="eyebrow">★ Séance personnelle ★</div>
      <h1 style="font-size:26px;">CinéList</h1>
      <p style="color:var(--muted); font-size:13.5px; line-height:1.5;">
        Pour récupérer automatiquement synopsis, affiches et infos de production, colle ta clé API TMDB (gratuite).
      </p>
      <input id="apikey-input" class="field" placeholder="Clé API TMDB (v3 auth)" />
      <button class="primary-btn" onclick="setApiKey()">Valider</button>
      <p style="color:var(--muted-dark); font-size:11.5px; margin-top:14px;">
        Tu peux aussi continuer sans clé pour l'instant — utilise "Ajouter" pour saisir les titres manuellement, et ajoute la clé plus tard via le lien en haut de la page.
      </p>
      <button class="ghost-btn" style="width:100%;margin-top:6px;" onclick="render()">Continuer sans clé</button>
    </div>
  `;
} else {
  render();
}
</script>
</body>
</html>
