<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>CinéList</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#12101A" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="CinéList" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<style>
  :root {
    --bg: #12101A;
    --bg-alt: #1A1626;
    --card: #1F1B2E;
    --gold: #E8B34C;
    --gold-dim: #B98C3A;
    --burgundy: #8B2635;
    --burgundy-light: #B33B4E;
    --text: #F5F1E8;
    --muted: #A89FC4;
    --muted-dark: #665C82;
    --border: #332C4A;
  }
  body.theme-light {
    --bg: #F5F1E8;
    --bg-alt: #EDE6D6;
    --card: #FFFFFF;
    --gold: #C9932F;
    --gold-dim: #A97A28;
    --burgundy: #8B2635;
    --burgundy-light: #A5334A;
    --text: #241F36;
    --muted: #5B5470;
    --muted-dark: #8C8499;
    --border: #E3DACB;
  }
  body.theme-red {
    --bg: #1A0808;
    --bg-alt: #240D0D;
    --card: #2E1010;
    --gold: #E85C4C;
    --gold-dim: #B8493D;
    --burgundy: #8B1A1A;
    --burgundy-light: #C23B3B;
    --text: #F5E8E8;
    --muted: #C49F9F;
    --muted-dark: #7A5C5C;
    --border: #4A2020;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 28px 16px 60px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  .app-shell { display: flex; min-height: 100vh; }
  .sidebar { width: 220px; flex-shrink: 0; background: var(--card); border-right: 1px solid var(--border); padding: 18px 14px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
  .sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 20px; }
  .sidebar-brand .icon { width: 32px; height: 32px; border-radius: 9px; background: var(--gold); color: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .sidebar-brand .name { font-family: Georgia, serif; font-size: 16px; }
  .side-nav-item { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 10px; border: 1px solid transparent; background: none; color: var(--muted); font-size: 14px; cursor: pointer; text-align: left; width: 100%; }
  .side-nav-item .ico { font-size: 15px; width: 18px; text-align: center; flex-shrink: 0; }
  .side-nav-item:hover { background: var(--bg-alt); }
  .side-nav-item.active { border-color: var(--gold-dim); background: rgba(232,179,76,0.08); color: var(--gold); font-weight: 600; }
  .main-content { flex: 1; min-width: 0; padding: 26px 24px 60px; }
  .page-title { font-family: Georgia, serif; font-size: 28px; margin: 0 0 4px; }
  .page-sub { color: var(--muted-dark); font-size: 13px; margin-bottom: 20px; }
  .mobile-topbar, .mobile-bottombar { display: none; }
  .mobile-nav-icon { width: 40px; height: 40px; border-radius: 12px; border: none; background: none; color: var(--muted); font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .mobile-nav-icon.active { color: var(--gold); background: rgba(232,179,76,0.14); }
  .mobile-nav-icon-lg { width: 50px; height: 50px; font-size: 22px; border-radius: 14px; }
  .type-segmented { display: none; }
  body.layout-mobile .type-segmented { display: flex; gap: 6px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 4px; margin-bottom: 14px; }
  .type-segment { flex: 1; padding: 9px 4px; border-radius: 9px; border: none; background: none; color: var(--muted); font-size: 12.5px; font-weight: 500; cursor: pointer; white-space: nowrap; }
  .type-segment.active { background: var(--gold); color: var(--bg); font-weight: 700; }
  body.layout-mobile .filters { display: none; }
  body.layout-mobile .search-row { display: none; }
  body.layout-mobile.mobile-search-open .search-row { display: flex; margin-bottom: 14px; }
  body.layout-mobile .app-shell { display: block; }
  body.layout-mobile .sidebar { display: none; }
  body.layout-mobile .mobile-topbar { display: flex; align-items: flex-end; justify-content: space-evenly; position: fixed; top: 0; left: 0; right: 0; height: calc(54px + env(safe-area-inset-top, 0px)); padding-bottom: 6px; background: var(--card); border-bottom: 1px solid var(--border); z-index: 40; box-sizing: border-box; }
  body.layout-mobile .mobile-bottombar { display: flex; align-items: center; justify-content: space-evenly; position: fixed; bottom: 0; left: 0; right: 0; height: 66px; background: var(--card); border-top: 1px solid var(--border); z-index: 40; padding-bottom: env(safe-area-inset-bottom, 0); }
  body.layout-mobile { padding: 0; }
  body.layout-mobile .main-content { padding: calc(66px + env(safe-area-inset-top, 0px)) 14px 90px; box-sizing: border-box; }
  body.layout-mobile .grid { grid-template-columns: repeat(3, 1fr) !important; gap: 8px !important; }
  body.layout-mobile .grid.compact { grid-template-columns: repeat(3, 1fr) !important; }
  body.layout-mobile .badge-type { display: none; }
  body.layout-mobile .heart-btn { display: none !important; }
  .lp-overlay { position: absolute; inset: 0; background: rgba(18,16,26,0.8); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; z-index: 25; border-radius: inherit; }
  .lp-icon-btn { width: 46px; height: 46px; border-radius: 50%; background: rgba(245,241,232,0.12); border: 1.5px solid rgba(245,241,232,0.4); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .lp-icon-btn:active { transform: scale(0.92); }
  body.layout-mobile .page-title { font-size: 20px !important; margin-bottom: 2px; }
  body.layout-mobile .modal { max-width: 100% !important; width: 100%; }
  h1 { font-family: Georgia, serif; font-size: 34px; margin: 0; letter-spacing: 0.5px; }
  .eyebrow { font-size: 11px; letter-spacing: 3px; color: var(--gold); text-transform: uppercase; margin-bottom: 6px; }
  .sub { color: var(--muted-dark); font-size: 13px; margin-top: 4px; }

  .tabs { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 4px; margin-bottom: 16px; }
  .tab-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 10px 0; border-radius: 9px; border: none; cursor: pointer; background: transparent; color: var(--muted); font-weight: 500; font-size: 14px; }

  .search-row { display: flex; gap: 8px; margin-bottom: 14px; position: relative; }

  .search-clear-btn:hover { color: var(--text); }
  .search-box input { flex: 1; background: none; border: none; color: var(--text); padding: 10px 8px; font-size: 14px; }
  .btn-gold { display: flex; align-items: center; gap: 6px; background: var(--gold); color: var(--bg); border: none; border-radius: 10px; padding: 0 16px; font-weight: 600; font-size: 14px; cursor: pointer; }
  .suggest-dropdown { position: absolute; top: calc(100% + 6px); left: 0; right: 68px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 6px; z-index: 30; max-height: 320px; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,0.35); }
  .suggest-item { display: flex; align-items: center; gap: 10px; padding: 7px; border-radius: 8px; }

  .suggest-item .info { flex: 1; min-width: 0; }

  .suggest-item .sy { font-size: 11px; color: var(--muted-dark); }

  .suggest-add-btn:disabled { background: var(--muted-dark); cursor: default; }

  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 22px; }
  .chip { display: flex; align-items: center; gap: 4px; font-size: 12.5px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; }
  .chip.active { border-color: var(--gold); background: rgba(232,179,76,0.1); color: var(--gold); }
  .chip.fav.active { border-color: var(--burgundy-light); background: rgba(179,59,78,0.12); color: var(--burgundy-light); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
  .grid.compact { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .ticket { background: var(--card); border-radius: 14px; overflow: hidden; border: 1px solid var(--border); display: flex; flex-direction: column; transition: transform 150ms ease, border-color 150ms ease; cursor: pointer; position: relative; }
  .ticket.expanded { z-index: 30; overflow: visible; }
  .season-dropdown { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px; box-shadow: 0 16px 32px rgba(0,0,0,0.5); max-height: 320px; overflow-y: auto; cursor: default; z-index: 10; }
  .ticket:hover { border-color: var(--gold-dim); transform: translateY(-2px); }
  .ticket.fav { border-color: var(--burgundy-light); }
  .poster { aspect-ratio: 2 / 3; position: relative; display: flex; align-items: center; justify-content: center; background-size: cover; background-position: center; overflow: hidden; }
  .poster img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
  .poster-initials { font-family: Georgia, serif; font-size: 28px; color: rgba(245,241,232,0.85); letter-spacing: 1px; }
  .badge-type { position: absolute; top: 8px; left: 8px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; background: rgba(18,16,26,0.7); color: #D8D3E8; padding: 3px 7px; border-radius: 999px; display: flex; align-items: center; gap: 4px; }
  .poster-footer { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(18,16,26,0.78); color: var(--gold); font-size: 11px; text-align: center; padding: 4px 6px; font-weight: 600; }
  .quickmark-btn { position: absolute; bottom: 58px; right: 8px; width: 38px; height: 38px; border-radius: 50%; background: rgba(18,16,26,0.4); border: 1.5px solid rgba(245,241,232,0.55); backdrop-filter: blur(1px); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 120ms ease; }
  .quickmark-btn:hover { background: rgba(232,179,76,0.55); border-color: var(--gold); }
  .quickmark-btn:active { transform: scale(0.94); }
  .quickmark-btn.watched { background: var(--gold); border-color: var(--gold); }
  .quickmark-btn.watched:hover { background: var(--gold-dim); }
  .heart-btn { position: absolute; bottom: 26px; right: 8px; width: 24px; height: 24px; border-radius: 50%; background: rgba(18,16,26,0.7); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .tear { height: 0; border-top: 2px dashed var(--border); position: relative; }
  .tear::before, .tear::after { content: ''; position: absolute; top: -7px; width: 14px; height: 14px; border-radius: 50%; background: var(--bg); }
  .tear::before { left: -8px; } .tear::after { right: -8px; }
  .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .title { font-family: Georgia, serif; font-size: 15.5px; line-height: 1.25; }
  .year { font-size: 12px; color: var(--muted-dark); margin-top: 2px; }
  .status-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .status-chip { display: flex; align-items: center; gap: 4px; font-size: 11px; padding: 4px 8px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--muted-dark); cursor: pointer; }
  .status-chip.active { background: rgba(232,179,76,0.13); }
  .badge-status { display: flex; align-items: center; gap: 4px; font-size: 10.5px; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .foot-row { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 2px; }
  .stars { display: flex; gap: 2px; }
  .star-btn { background: none; border: none; padding: 0; cursor: pointer; line-height: 0; }
  .note-link { font-size: 11px; background: none; border: none; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; color: var(--muted-dark); }
  .note-link.has { color: var(--gold); }

  .empty { text-align: center; padding: 60px 20px; color: var(--muted-dark); }
  .empty .t { font-family: Georgia, serif; font-size: 17px; color: var(--muted); margin-bottom: 6px; }

  .overlay { position: fixed; inset: 0; background: rgba(18,16,26,0.78); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .modal { background: var(--card); border-radius: 16px; width: 100%; max-width: 420px; max-height: 88vh; overflow-y: auto; border: 1px solid var(--border); }
  .modal-pad { padding: 20px 22px; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .modal-title { font-family: Georgia, serif; font-size: 18px; }
  .x-btn { background: none; border: none; color: var(--muted-dark); cursor: pointer; }
  .field-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 6px; }
  .field { width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-alt); color: var(--text); font-size: 14px; margin-bottom: 14px; }
  textarea.field { resize: vertical; }
  .primary-btn { width: 100%; padding: 11px 0; border-radius: 8px; border: none; background: var(--gold); color: var(--bg); font-weight: 600; font-size: 14px; cursor: pointer; }
  .primary-btn:disabled { background: var(--muted-dark); cursor: not-allowed; }
  .ghost-btn { flex: 1; padding: 10px 0; border-radius: 8px; border: 1px solid var(--border); background: none; color: var(--muted); font-size: 13.5px; cursor: pointer; }

  .search-result { display: flex; gap: 10px; padding: 8px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
  .search-result:hover { background: var(--bg-alt); border-color: var(--border); }
  .search-result img, .search-result .ph { width: 42px; height: 62px; border-radius: 6px; object-fit: cover; background: var(--bg-alt); flex-shrink: 0; }
  .search-result .info { display: flex; flex-direction: column; justify-content: center; }
  .search-result .st { font-size: 13.5px; }
  .search-result .sy { font-size: 11.5px; color: var(--muted-dark); }

  .season-row { border: 1px solid var(--border); border-radius: 10px; padding: 9px 10px; background: var(--bg-alt); }
  .season-del-btn { background: none; border: none; cursor: pointer; padding: 2px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .season-head { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .season-bar { flex: 1; height: 4px; border-radius: 999px; background: var(--card); overflow: hidden; }
  .season-bar-fill { height: 100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold)); border-radius: 999px; }
  .ep-grid { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .ep-btn { width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--border); background: var(--card); color: var(--muted-dark); font-size: 10.5px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .ep-btn.watched { border-color: var(--gold); background: var(--gold); color: var(--bg); }

  .episode-info { flex: 1; min-width: 0; }
  .episode-title { font-size: 12.5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

</head>
<body>
<div id="app"></div>

<script>
/* ---------- State & persistence ---------- */
const LS_KEY = 'cinelist_items_v1';
const LS_API = 'cinelist_tmdb_key_v1';
const LS_LOG = 'cinelist_watchlog_v1';
const LS_THEME = 'cinelist_theme_v1';
const LS_SORT = 'cinelist_sort_v1';
const LS_COMPACT = 'cinelist_compact_v1';
const LS_FOOTER_STYLE = 'cinelist_footer_style_v1';
const LS_LANGUAGE = 'cinelist_language_v1';
const LS_DISPLAY_MODE = 'cinelist_display_mode_v1';
const LS_PROVIDERS = 'cinelist_providers_v1';

function makeSeason(number, episodeCount, watchedCount) {
  watchedCount = watchedCount || 0;
  return { number, episodes: Array.from({ length: episodeCount }, (_, i) => i < watchedCount) };
}

function seed() {
  const base = Date.now() - 8 * 60000;
  const list = [
    { id: 's1', title: 'Le Bureau des Légendes', type: 'series', year: 2015, rating: 5, review: '', favorite: true, seasons: [makeSeason(1,10,10),makeSeason(2,10,10),makeSeason(3,10,10),makeSeason(4,10,10),makeSeason(5,10,10)] },
    { id: 's2', title: 'Dune', type: 'movie', year: 2021, status: 'watched', rating: 4, review: '', favorite: true },
    { id: 's3', title: 'Chernobyl', type: 'series', year: 2019, rating: 5, review: '', seasons: [makeSeason(1,5,5)] },
    { id: 's4', title: 'Oppenheimer', type: 'movie', year: 2023, status: 'to_watch', rating: 0, review: '' },
    { id: 's5', title: 'Severance', type: 'series', year: 2022, rating: 0, review: '', seasons: [makeSeason(1,9,9),makeSeason(2,10,3)] },
    { id: 's6', title: 'Blade Runner 2049', type: 'movie', year: 2017, status: 'to_watch', rating: 0, review: '' },
    { id: 's7', title: 'True Detective', type: 'series', year: 2014, rating: 4, review: '', seasons: [makeSeason(1,8,8)] },
    { id: 's8', title: 'Parasite', type: 'movie', year: 2019, status: 'to_watch', rating: 0, review: '' },
  ];
  return list.map((it, i) => ({ ...it, addedAt: base + i * 60000 }));
}

let state = {
  apiKey: localStorage.getItem(LS_API) || 'cebdf84753b077466936468991a7f363',
  items: JSON.parse(localStorage.getItem(LS_KEY) || 'null') || seed(),
  tab: 'series',
  query: '',
  statusFilter: 'all',
  showAdd: false,
  reviewItemId: null,
  detailItemId: null,
  detailTab: 'details', // 'episodes' | 'details' | 'trailer'
  detailEdit: false,
  addQuery: '',
  addResults: [],
  addSearching: false,
  addSelected: null, // normalized TMDB item ready to add
  expandedSeasons: {}, // itemId -> {seasonIdx: bool}
  seasonsOpen: {}, // itemId -> bool (floating dropdown)
  mainSuggestions: [],
  mainSuggestError: null,
  mainSuggestTimer: null,
  mainAdding: null, // tmdb id currently being added, for a small loading state
  watchLog: JSON.parse(localStorage.getItem(LS_LOG) || 'null') || [], // [{date:'YYYY-MM-DD', minutes:N}]
  theme: localStorage.getItem(LS_THEME) || 'dark',
  sortOrder: localStorage.getItem(LS_SORT) || 'recent', // 'alpha' | 'added' | 'recent'
  compactView: localStorage.getItem(LS_COMPACT) === 'true',
  footerStyle: localStorage.getItem(LS_FOOTER_STYLE) || 'remaining', // 'remaining' | 'nextEpisode'
  language: localStorage.getItem(LS_LANGUAGE) || 'fr', // 'fr' | 'en'
  displayMode: localStorage.getItem(LS_DISPLAY_MODE) || 'auto', // 'auto' | 'mobile' | 'web'
  selectedProviderIds: JSON.parse(localStorage.getItem(LS_PROVIDERS) || '[]'),
  showAllProviders: {}, // itemId -> bool (reveal full unfiltered list)
  expandedOverviews: {}, // `${itemId}:${seasonNumber}:${epIdx}` -> bool
  providerSearchQuery: '',

function persistItems() { localStorage.setItem(LS_KEY, JSON.stringify(state.items)); }
function persistKey() { localStorage.setItem(LS_API, state.apiKey); }
function persistWatchLog() { localStorage.setItem(LS_LOG, JSON.stringify(state.watchLog)); }

function globalWatchTotals(items) {
  let minutes = 0;
  items.forEach((it) => {
    if (it.type === 'series') {
      const { watched } = seriesProgress(it);
      const rt = (typeof it.episodeRuntime === 'number' && it.episodeRuntime > 0) ? it.episodeRuntime : 45;
      minutes += watched * rt;
    } else if (it.type === 'movie' && it.status === 'watched') {
      minutes += (typeof it.runtime === 'number' && it.runtime > 0) ? it.runtime : 100;
    }
  });
  return minutes;
}

function logWatchDelta(deltaMinutes) {
  if (deltaMinutes <= 0) return;
  const today = new Date().toISOString().slice(0, 10);
  const entry = state.watchLog.find((e) => e.date === today);
  if (entry) entry.minutes += deltaMinutes;
  else state.watchLog.push({ date: today, minutes: deltaMinutes });
  persistWatchLog();
}

function itemWatchUnits(it) {
  if (it.type === 'series') return seriesProgress(it).watched;
  if (it.type === 'movie') return it.status === 'watched' ? 1 : 0;
  return 0;
}

function updateItem(updated) {
  const prev = findItem(updated.id);
  const prevUnits = prev ? itemWatchUnits(prev) : 0;
  const newUnits = itemWatchUnits(updated);
  if (newUnits > prevUnits) updated = { ...updated, lastWatchedAt: Date.now() };

  const before = globalWatchTotals(state.items);
  state.items = state.items.map((it) => (it.id === updated.id ? updated : it));
  const after = globalWatchTotals(state.items);
  logWatchDelta(after - before);
  persistItems();
  render();
}
function findItem(id) { return state.items.find((it) => it.id === id); }

const FILM_STATUS = { to_watch: { label: 'À voir', color: 'var(--muted)' }, watched: { label: 'Vu', color: 'var(--burgundy-light)' } };
const SERIES_STATUS = { to_watch: { label: 'À voir', color: 'var(--muted)' }, watching: { label: 'En cours', color: 'var(--gold)' }, watched: { label: 'Terminée', color: 'var(--burgundy-light)' } };

function seasonProgress(season) {
  const total = season.episodes.length;
  const watched = season.episodes.filter(Boolean).length;
  return { watched, total };
}
function findNextEpisode(item) {
  const seasons = item.seasons || [];
  const { total } = seriesProgress(item);
  const airedCount = (typeof item.airedCount === 'number') ? item.airedCount : total;
  let cum = 0;
  for (let si = 0; si < seasons.length; si++) {
    const eps = seasons[si].episodes;
    for (let ei = 0; ei < eps.length; ei++) {
      if (cum < airedCount && !eps[ei]) return { seasonIdx: si, epIdx: ei };
      cum++;
    }
  }
  return null;
}

function seriesProgress(item) {
  const seasons = item.seasons || [];
  return seasons.reduce((acc, s) => {
    const p = seasonProgress(s);
    return { watched: acc.watched + p.watched, total: acc.total + p.total };
  }, { watched: 0, total: 0 });
}
function isSeriesOngoing(item) {
  const s = (item.tmdbStatus || '').trim();
  return s === 'Returning Series' || s === 'In Production' || s === 'Planned';
}
function seriesStatus(item) {
  const { watched, total } = seriesProgress(item);
  if (total === 0 || watched <= 0) return 'to_watch';
  if (watched >= total) return isSeriesOngoing(item) ? 'to_watch' : 'watched';
  return 'watching';
}
function effectiveStatus(item) { return item.type === 'series' ? seriesStatus(item) : item.status; }

function initials(title) {
  return title.split(' ').filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
}
function posterHue(title) {
  let h = 0;
  for (let i = 0; i < title.length; i++) h = (h * 31 + title.charCodeAt(i)) % 360;
  return h;
}

async function loadSuggestionSection(key, append) {
  if (!state.apiKey) return;
  const current = getSuggestionSlot(key);
  if (!append && current && current !== 'error' && current !== 'loading') return;
  const startPage = append && current && current.results ? current.page + 1 : 1;
  setSuggestionSlot(key, append && current && current.results ? { ...current, loadingMore: true } : 'loading');
  render();
  try {
    const pageData = await fetchTmdbPage(suggestionUrl(key, startPage));
    const prevResults = append && current && current.results ? current.results : [];
    setSuggestionSlot(key, {
      results: [...prevResults, ...pageData.results],
      page: pageData.page,
      totalPages: pageData.totalPages,
      hasMore: pageData.page < pageData.totalPages,
      loadingMore: false,
    });
  } catch (e) {
    setSuggestionSlot(key, (append && current && current.results) ? { ...current, loadingMore: false } : 'error');
  }
  render();
}

function spacingVariants(q) {
  if (q.includes(' ') || q.length < 5) return [];
  const positions = [];
  const mid = Math.floor(q.length / 2);
  for (let offset = 0; offset < q.length && positions.length < 4; offset++) {
    for (const sign of offset === 0 ? [0] : [1, -1]) {
      const pos = mid + sign * offset;
      if (pos >= 2 && pos <= q.length - 2 && !positions.includes(pos)) {
        positions.push(pos);
        if (positions.length >= 4) break;
      }
    }
  }
  return positions.sort((a, b) => a - b).map((pos) => q.slice(0, pos) + ' ' + q.slice(pos));
}
async function tmdbSearch(query, type) {

async function tmdbDetails(id, type) {

    throw new Error(`TMDB (${res.status}) ${detail}`);

  const data = await res.json();
  if (type === 'series') {
    // `status` (Returning Series / Ended / Canceled / ...) is a technical field, not display

function normalizeTmdb(details, type) {
  const genre = (details.genres || []).map((g) => g.name).join(', ');
  let director = '';
  let studio = '';
  let country = '';
  if (type === 'movie') {
    const d = (details.credits && details.credits.crew || []).find((c) => c.job === 'Director');
    director = d ? d.name : '';
    studio = (details.production_companies || [])[0] ? details.production_companies[0].name : '';
    country = (details.production_countries || [])[0] ? details.production_countries[0].name : '';
  } else {
    director = (details.created_by || []).map((c) => c.name).join(', ');
    studio = (details.networks || [])[0] ? details.networks[0].name : '';
    country = (details.production_countries || [])[0] ? details.production_countries[0].name
              : (details.origin_country || [])[0] || '';
  }
  const castList = (details.credits && details.credits.cast || []).slice(0, 8).map((c) => ({ id: c.id, name: c.name, profilePath: c.profile_path || null }));
  const releaseDate = type === 'movie' ? (details.release_date || '') : '';
  const runtime = type === 'movie' ? (details.runtime || null) : null;
  const year = type === 'movie'
    ? (details.release_date || '').slice(0, 4)
    : (details.first_air_date || '').slice(0, 4);
  let seasons = null;
  let nextEpisodeDate = null;
  let airedCount = null;
  let episodeRuntime = null;
  let tmdbStatus = null;
  if (type === 'series') {
    tmdbStatus = details.status || null;
    seasons = (details.seasons || [])
      .filter((s) => s.season_number > 0 && s.episode_count > 0)
      .map((s) => ({ number: s.season_number, episodeCount: s.episode_count }))
      .sort((a, b) => a.number - b.number);
    const next = details.next_episode_to_air;
    nextEpisodeDate = next ? next.air_date : null;
    if (next) {
      // Episodes actually released = everything before the next upcoming one.
      airedCount = seasons
        .filter((s) => s.number < next.season_number)
        .reduce((sum, s) => sum + s.episodeCount, 0)
        + Math.max(0, (next.episode_number || 1) - 1);
    } else {
      // No upcoming episode known — treat everything listed as already aired.
      airedCount = seasons.reduce((sum, s) => sum + s.episodeCount, 0);
    }
    episodeRuntime = (details.episode_run_time && details.episode_run_time[0]) || null;
  }
  return {
    title: type === 'movie' ? details.title : details.name,
    year: year ? parseInt(year, 10) : '',
    posterPath: details.poster_path || '',
    synopsis: details.overview || '',
    director, studio, country, genre, castList, seasons,
    tmdbId: details.id, nextEpisodeDate, airedCount, releaseDate, episodeRuntime, runtime, tmdbStatus,
    collectionId: (type === 'movie' && details.belongs_to_collection) ? details.belongs_to_collection.id : null,
    collectionName: (type === 'movie' && details.belongs_to_collection) ? details.belongs_to_collection.name : null,
  };
}

function starsHtml(value, onClickFn, size, uid) {

  }
  return out + `</div>`;
}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  return Math.ceil((new Date(dateStr + 'T00:00:00') - new Date(new Date().toDateString())) / 86400000);
}
function isUpcomingMovie(item) {
  if (item.type !== 'movie' || !item.releaseDate) return false;
  const days = daysUntil(item.releaseDate);
  return days !== null && days >= 0;
}
function isUpcomingSeries(item) {
  if (item.type !== 'series') return false;
  const { watched, total } = seriesProgress(item);
  const airedCount = (typeof item.airedCount === 'number') ? item.airedCount : total;
  // Never started, and nothing has aired yet at all.
  if (watched === 0 && airedCount === 0) return true;
  // Fully watched everything currently known/announced (the season in progress is finished),
  // and a further episode is already confirmed — a genuinely new season, not just the next
  // episode of the season you're mid-way through.
  if (total > 0 && watched >= total && item.nextEpisodeDate) {
    const d = daysUntil(item.nextEpisodeDate);
    if (d !== null && d >= 0) return true;
  }
  return false;
}
function countdownLabel(days, prefix) {
  if (days > 1) return `${prefix} dans ${days} jours`;
  if (days === 1) return `${prefix} demain`;
  if (days === 0) return `${prefix} aujourd'hui`;
  return '';
}

function ticketHtml(item) {
  const status = effectiveStatus(item);
  if (item.type === 'movie') {
    const chips = Object.entries(FILM_STATUS).map(([key, m]) => `
      <button class="status-chip ${item.status === key ? 'active' : ''}" style="${item.status===key?`border-color:${m.color};color:${m.color};`:''}"
        onclick="event.stopPropagation(); setFilmStatus('${item.id}','${key}')">${m.label}</button>
    `).join('');
    let movieFooter = '';
    if (item.status === 'watched') {
      movieFooter = 'Vu ✓';
    } else if (item.releaseDate) {
      const days = daysUntil(item.releaseDate);
      if (days !== null && days >= 0) movieFooter = countdownLabel(days, 'Sortie') || 'Sortie aujourd\'hui';
    }
    if (state.compactView) {
      return `<div class="ticket compact ${item.favorite?'fav':''}">
        ${posterHtml(item, { withHeart: true, openId: item.id, footerText: movieFooter, movieMarkId: item.status==='watched' ? null : item.id, movieWatched: item.status==='watched' })}
      </div>`;
    }
    return `<div class="ticket ${item.favorite?'fav':''}">
      ${posterHtml(item, { withHeart: true, openId: item.id, footerText: movieFooter, movieMarkId: item.status==='watched' ? null : item.id, movieWatched: item.status==='watched' })}
      <div class="tear"></div>
      <div class="body">
        <div onclick="openDetail('${item.id}')" style="cursor:pointer;"><div class="title">${esc(item.title)}</div><div class="year">${item.year||''}</div></div>
        <div class="status-row">${chips}</div>
        <div class="foot-row">
          ${starsHtml(item.rating, `setRating_${item.id}`, 16, item.id)}
          <button class="note-link ${item.review?'has':''}" onclick="event.stopPropagation(); openReview('${item.id}')">${item.review?'Voir la note':'Ajouter une note'}</button>
        </div>
      </div>
    </div>`;
  } else {
    const meta = SERIES_STATUS[status];
    const isUp = isUpcomingSeries(item);
    const { watched, total } = seriesProgress(item);
    const caughtUpAndOngoing = watched > 0 && watched >= total && isSeriesOngoing(item);
    const isCanceled = status === 'watched' && item.tmdbStatus === 'Canceled';
    const badgeLabel = isUp ? 'Bientôt dispo' : caughtUpAndOngoing ? 'À jour' : isCanceled ? 'Annulée' : meta.label;
    const badgeColor = isUp ? 'var(--gold)' : caughtUpAndOngoing ? 'var(--gold)' : isCanceled ? 'var(--muted-dark)' : meta.color;
    const pct = total > 0 ? Math.round((watched/total)*100) : 0;
    const seasons = item.seasons || [];
    const airedCount = (typeof item.airedCount === 'number') ? item.airedCount : total;
    const remainingAired = Math.max(0, airedCount - watched);
    const nextEp = findNextEpisode(item);
    let footerText = '';
    if (total > 0) {
      if (watched === 0) {
        footerText = airedCount === 0 ? 'Bientôt dispo' : 'Nouveau';
      } else if (remainingAired > 0) {
        if (state.footerStyle === 'nextEpisode' && nextEp) {
          const sNum = String(seasons[nextEp.seasonIdx].number).padStart(2, '0');
          const eNum = String(nextEp.epIdx + 1).padStart(2, '0');
          footerText = `S${sNum}E${eNum}`;
        } else {
          footerText = `${remainingAired} épisode${remainingAired>1?'s':''} restant${remainingAired>1?'s':''}`;
        }
      } else if (item.nextEpisodeDate) {
        const days = Math.ceil((new Date(item.nextEpisodeDate + 'T00:00:00') - new Date(new Date().toDateString())) / 86400000);
        if (days > 1) footerText = `Prochain épisode dans ${days} jours`;
        else if (days === 1) footerText = `Prochain épisode demain`;
        else if (days === 0) footerText = `Prochain épisode aujourd'hui`;
        else footerText = 'À jour ✓';
      } else if (watched >= total) {
        footerText = isSeriesOngoing(item) ? 'À jour ✓' : (item.tmdbStatus === 'Canceled' ? 'Annulée' : 'Terminée ✓');
      } else {
        footerText = 'À jour ✓';
      }
    }
    const seasonsOpen = !!state.seasonsOpen[item.id];
    let seasonsDropdown = '';
    if (seasonsOpen) {
      const seasonsRows = seasons.map((s, idx) => {
        const sp = seasonProgress(s);
        const spct = sp.total > 0 ? Math.round((sp.watched/sp.total)*100) : 0;
        const expanded = !!((state.expandedSeasons[item.id]||{})[idx]);
        const epGrid = expanded ? episodeRowsHtml(item, idx, s) : '';
        return `<div class="season-row">
          <div class="season-head" onclick="event.stopPropagation(); toggleSeasonExpand('${item.id}',${idx})">
            <span>${expanded ? '▾' : '▸'}</span>
            <span style="font-size:13px;font-weight:600;">Saison ${s.number}</span>
            <div class="season-bar"><div class="season-bar-fill" style="width:${spct}%"></div></div>
            <span style="font-size:11px;color:var(--muted-dark);white-space:nowrap;">${sp.watched}/${sp.total}</span>
            <button class="season-del-btn" onclick="event.stopPropagation(); deleteSeason('${item.id}',${idx})" title="Supprimer cette saison">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--muted-dark)" stroke-width="2">
                <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
              </svg>
            </button>
          </div>
          ${epGrid}
        </div>`;
      }).join('');
      seasonsDropdown = `<div class="season-dropdown" id="season-dropdown-${item.id}" onclick="event.stopPropagation()">${seasonsRows || `<div style="font-size:12px;color:var(--muted-dark);">Aucune saison ajoutée.</div>`}</div>`;
    }
    if (state.compactView) {
      return `<div class="ticket compact ${item.favorite?'fav':''}">
        ${posterHtml(item, { withHeart: true, openId: item.id, footerText, quickMarkId: nextEp ? item.id : null })}
      </div>`;
    }
    return `<div class="ticket ${item.favorite?'fav':''} ${seasonsOpen?'expanded':''}">
      ${posterHtml(item, { withHeart: true, openId: item.id, footerText, quickMarkId: nextEp ? item.id : null })}
      <div class="tear"></div>
      <div class="body">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div onclick="openDetail('${item.id}')" style="cursor:pointer;"><div class="title">${esc(item.title)}</div><div class="year">${item.year||''}</div></div>
          <span class="badge-status" style="border:1px solid ${badgeColor};background:${badgeColor}22;color:${badgeColor};">${badgeLabel}</span>
        </div>
        <div style="position:relative;">
          <div onclick="event.stopPropagation(); toggleSeasonsOpen('${item.id}')" style="cursor:pointer;" title="Voir les saisons et épisodes">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
              <span style="color:var(--muted);font-size:11px;">${seasonsOpen?'▾':'▸'} ${seasons.length} saison${seasons.length>1?'s':''}</span>
              <span style="font-size:11px;color:var(--muted-dark);">${total>0?`${watched} / ${total} épisodes`:'Aucun épisode ajouté'}</span>
            </div>
            <div class="season-bar" style="height:5px;background:var(--bg-alt);"><div class="season-bar-fill" style="width:${pct}%"></div></div>
          </div>
          ${seasonsDropdown}
        </div>
        <div class="foot-row">
          ${starsHtml(item.rating, `setRating_${item.id}`, 16, item.id)}
          <button class="note-link ${item.review?'has':''}" onclick="openReview('${item.id}')">${item.review?'Voir la note':'Ajouter une note'}</button>
        </div>
      </div>
    </div>`;
  }
}

window.setQuery = (v) => {
  state.query = v;
  clearTimeout(state.mainSuggestTimer);
  const q = v.trim();
  if (q.length < 2 || !state.apiKey) {
    state.mainSuggestions = [];
    state.mainSuggestError = null;
    render();
    return;
  }
  render();
  state.mainSuggestTimer = setTimeout(async () => {
    if (state.query.trim() !== q) return; // query changed since timer was set
    try {
      const queries = [q, ...spacingVariants(q)];
      const calls = queries.flatMap((vq) => [
        tmdbSearch(vq, 'movie').then((r) => r.map((x) => ({ ...x, __type: 'movie' }))),
        tmdbSearch(vq, 'series').then((r) => r.map((x) => ({ ...x, __type: 'series' }))),
      ]);
      const results = await Promise.all(calls);
      const existingIds = new Set(state.items.filter((it) => it.tmdbId).map((it) => it.tmdbId));
      const seen = new Set();
      const merged = results.flat().filter((r) => {
        const key = `${r.__type}:${r.id}`;
        if (seen.has(key) || existingIds.has(r.id)) return false;
        seen.add(key);
        return true;
      }).sort((a, b) => (b.popularity || 0) - (a.popularity || 0));
      state.mainSuggestions = merged;
      state.mainSuggestError = null;
    } catch (e) {
      state.mainSuggestions = [];
      state.mainSuggestError = e.message;
    }
    render();
  }, 400);
};

async function ensureSeasonEpisodesLoaded(item, idx) {
  if (!item || !item.tmdbId) return;
  const season = (item.seasons || [])[idx];
  if (!season) return;
  const cacheKey = `${item.tmdbId}:${season.number}`;
  if (EPISODE_CACHE[cacheKey] && EPISODE_CACHE[cacheKey] !== 'error') return;
  if (!state.apiKey) return;
  EPISODE_CACHE[cacheKey] = 'loading';
  render();
  try {
    const url = `https://api.themoviedb.org/3/tv/${item.tmdbId}/season/${season.number}?api_key=${encodeURIComponent(state.apiKey)}&language=fr-FR`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`TMDB (${res.status})`);
    const data = await res.json();
    EPISODE_CACHE[cacheKey] = (data.episodes || []).map((e) => ({
      number: e.episode_number, title: e.name, overview: e.overview, still: e.still_path, airDate: e.air_date,
    }));
  } catch (e) {
    EPISODE_CACHE[cacheKey] = 'error';
  }
  render();
}

window.toggleEpisode = (id, seasonIdx, epIdx) => {
  const item = findItem(id);
  const seasons = item.seasons || [];
  const willBeWatched = !seasons[seasonIdx].episodes[epIdx];
  const newSeasons = seasons.map((s, i) => {
    if (i < seasonIdx) {
      // Earlier seasons: marking watched fills them entirely; unmarking leaves them untouched.
      return willBeWatched ? { ...s, episodes: s.episodes.map(() => true) } : s;
    }
    if (i === seasonIdx) {
      const episodes = s.episodes.map((w, j) => willBeWatched ? (j <= epIdx ? true : w) : (j >= epIdx ? false : w));
      return { ...s, episodes };
    }
    // Later seasons: unmarking clears them entirely; marking watched leaves them untouched.
    return willBeWatched ? s : { ...s, episodes: s.episodes.map(() => false) };
  });
  updateItem({ ...item, seasons: newSeasons });
};

window.refreshFromTmdb = async (id) => {
  const item = findItem(id);
  if (!item || !item.tmdbId) return;
  if (!state.apiKey) { alert("Ajoute d'abord ta clé API TMDB."); return; }
  try {
    const details = await tmdbDetails(item.tmdbId, 'series');
    const norm = normalizeTmdb(details, 'series');
    const existing = item.seasons || [];
    const byNumber = {};
    existing.forEach((s, idx) => { byNumber[s.number] = idx; });
    let seasons = existing.map((s) => ({ ...s, episodes: [...s.episodes] }));
    (norm.seasons || []).forEach((ts) => {
      if (byNumber[ts.number] !== undefined) {
        const idx = byNumber[ts.number];
        const local = seasons[idx];
        if (ts.episodeCount > local.episodes.length) {
          const extra = Array.from({ length: ts.episodeCount - local.episodes.length }, () => false);
          seasons[idx] = { ...local, episodes: [...local.episodes, ...extra] };
        }
      } else {
        seasons.push(makeSeason(ts.number, ts.episodeCount, 0));
      }
    });
    seasons.sort((a, b) => a.number - b.number);
    updateItem({ ...item, seasons, nextEpisodeDate: norm.nextEpisodeDate || null, airedCount: norm.airedCount, episodeRuntime: norm.episodeRuntime || item.episodeRuntime || null, tmdbStatus: norm.tmdbStatus || null });
    alert('Infos actualisées depuis TMDB.');
  } catch (e) {
    alert("Actualisation impossible : " + e.message);
  }
};

      sourceTitle: item.title,
      name: data.name,

        id: p.id, title: p.title, posterPath: p.poster_path || '', overview: p.overview || '',

function formatDuration(minutes) {
  if (minutes <= 0) return '0min';
  const days = Math.floor(minutes / 1440);
  const hours = Math.floor((minutes % 1440) / 60);
  const mins = minutes % 60;
  if (days > 0) return `${days}j ${hours}h`;
  if (hours > 0) return mins > 0 ? `${hours}h ${mins}min` : `${hours}h`;
  return `${mins}min`;
}

/* ---------- Reward tiers ---------- */
const TIERS = [
  { min: 0, title: 'Novice', emoji: '🌱' },
  { min: 15, title: 'Jeune Padawan', emoji: '📺' },
  { min: 35, title: 'Apprenti Cinéphile', emoji: '🍿' },

  { min: 375, title: "Vétéran de l'Écran", emoji: '🎞️' },

  { min: 1150, title: 'Oracle des Séries', emoji: '🔱' },
  { min: 1600, title: 'Mythe Vivant', emoji: '👑' },
];
function tierFor(units) {
  let current = TIERS[0];
  for (const t of TIERS) { if (units >= t.min) current = t; }
  return current;
}
function nextTierFor(units) {
  return TIERS.find((t) => t.min > units) || null;
}

const FUN_LINES = [
  { min: 0, text: "Ça commence tout juste." },
  { min: 3, text: "Un bon petit marathon." },
  { min: 24, text: "Une journée complète. Aucun regret." },

  { min: 168, text: "Une semaine entière. Respect." },
  { min: 336, text: "Deux semaines. Impressionnant." },
];
function funLineFor(hours) {
  let line = FUN_LINES[0].text;
  FUN_LINES.forEach((f) => { if (hours >= f.min) line = f.text; });
  return line;
}

function monthlyChartData() {
  const months = [];
  const now = new Date();
  for (let i = 11; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    const label = d.toLocaleDateString('fr-FR', { month: 'short' }).charAt(0).toUpperCase();
    months.push({ key, label, minutes: 0 });
  }
  (state.watchLog || []).forEach((e) => {
    const key = e.date.slice(0, 7);
    const m = months.find((mm) => mm.key === key);
    if (m) m.minutes += e.minutes;
  });
  const maxMinutes = Math.max(1, ...months.map((m) => m.minutes));
  return months.map((m, idx) => ({
    ...m,
    hours: Math.round((m.minutes / 60) * 10) / 10,
    pct: Math.max(3, Math.round((m.minutes / maxMinutes) * 100)),
    isCurrent: idx === months.length - 1,
  }));
}

const GENRE_COLORS = ['#E8B34C', '#4FA37A', '#5B8DEF', '#B33B4E', '#9C8CD8', '#665C82'];
function genreBreakdown() {
  const weights = {};
  state.items.forEach((it) => {
    let weight = 0;
    if (it.type === 'series') { weight = seriesProgress(it).watched; }
    else if (it.type === 'movie' && it.status === 'watched') { weight = 1; }
    if (weight <= 0 || !it.genre) return;
    const genres = it.genre.split(',').map((g) => g.trim()).filter(Boolean);
    if (!genres.length) return;
    const share = weight / genres.length;
    genres.forEach((g) => { weights[g] = (weights[g] || 0) + share; });
  });
  let entries = Object.entries(weights).map(([name, w]) => ({ name, w })).sort((a, b) => b.w - a.w);
  if (!entries.length) return [];
  const top = entries.slice(0, 5);
  const restW = entries.slice(5).reduce((s, e) => s + e.w, 0);
  if (restW > 0) top.push({ name: 'Autres', w: restW });
  const total = top.reduce((s, e) => s + e.w, 0) || 1;
  let cum = 0;
  return top.map((e, idx) => {
    const pct = Math.round((e.w / total) * 100);
    const from = cum; cum += pct;
    return { ...e, pct, color: GENRE_COLORS[idx % GENRE_COLORS.length], from, to: cum };
  });
}

function statsHtml() {
  const allSeries = state.items.filter((it) => it.type === 'series');
  const allMovies = state.items.filter((it) => it.type === 'movie');
  let totalEpisodesWatched = 0, seriesMinutes = 0, completedSeries = 0;
  allSeries.forEach((it) => {
    const { watched } = seriesProgress(it);
    totalEpisodesWatched += watched;
    const rt = (typeof it.episodeRuntime === 'number' && it.episodeRuntime > 0) ? it.episodeRuntime : 45;
    seriesMinutes += watched * rt;
    if (seriesStatus(it) === 'watched' && (it.seasons || []).length > 0) completedSeries += 1;
  });
  const moviesWatched = allMovies.filter((it) => it.status === 'watched');
  const moviesMinutes = moviesWatched.reduce((sum, it) => sum + ((typeof it.runtime === 'number' && it.runtime > 0) ? it.runtime : 100), 0);
  const totalMinutes = seriesMinutes + moviesMinutes;
  const totalHours = Math.round(totalMinutes / 60);

  const unitsWatched = totalEpisodesWatched + moviesWatched.length;
  const tier = tierFor(unitsWatched);
  const next = nextTierFor(unitsWatched);
  const progressPct = next ? Math.max(0, Math.min(1, (unitsWatched - tier.min) / (next.min - tier.min))) : 1;
  const STAMP_COUNT = 8;
  const filledStamps = Math.round(progressPct * STAMP_COUNT);

  const heroDays = Math.floor(totalHours / 24);
  const heroMain = heroDays >= 1 ? `${heroDays} jour${heroDays>1?'s':''}` : (totalHours >= 1 ? `${totalHours} heure${totalHours>1?'s':''}` : `${totalMinutes} min`);

  // --- Sparkline trend (last 12 months) ---
  const months = monthlyChartData();
  const sw = 300, sh = 54;
  const maxHours = Math.max(1, ...months.map((m) => m.hours));
  const stepX = sw / (months.length - 1);
  const pts = months.map((m, i) => [Math.round(i * stepX), Math.round(sh - (m.hours / maxHours) * (sh - 8))]);
  const linePath = 'M' + pts.map((p) => p.join(',')).join(' L');
  const areaPath = linePath + ` L${sw},${sh} L0,${sh} Z`;
  const monthLabels = months.map((m) => `<span style="flex:1;text-align:center;font-size:10px;color:${m.isCurrent?'var(--gold)':'var(--muted-dark)'};font-weight:${m.isCurrent?700:400};">${m.label}</span>`).join('');

  // --- Genres as a ranked list (no pie chart) ---
  const genres = genreBreakdown();
  const genreRows = genres.length
    ? genres.map((g, idx) => `
        <div style="margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;">
            <span style="color:var(--text);">${idx+1}. ${esc(g.name)}</span>
            <span style="color:var(--muted-dark);">${g.pct}%</span>

const SUGGESTION_DISPLAY_LIMIT = 12;

function suggestionRowHtml(data, existingIds, resolveType, loadMoreCall, sectionKey) {
  if (data === 'loading' || data === null || data === undefined) {
    return `<div style="font-size:12.5px;color:var(--muted-dark);">Chargement...</div>`;
  }
  if (data === 'error') {
    return `<div style="font-size:12.5px;color:var(--muted-dark);">Impossible de charger pour l'instant.</div>`;
  }
  const filtered = data.results.filter((r) => !existingIds.has(r.id));
  const expanded = !!state.suggestionExpanded[sectionKey];
  const displayed = expanded ? filtered : filtered.slice(0, SUGGESTION_DISPLAY_LIMIT);

  const grid = displayed.length
    ? `<div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(110px, 1fr));gap:14px;">${displayed.map((r) => suggestionCardHtml(r, resolveType(r))).join('')}</div>`
    : `<div style="font-size:12.5px;color:var(--muted-dark);">Rien de nouveau à suggérer pour l'instant.</div>`;

  let buttons = '';
  if (!expanded) {
    if (filtered.length > SUGGESTION_DISPLAY_LIMIT || data.hasMore) {
      buttons = `<button class="ghost-btn" style="width:100%;margin-top:12px;" onclick="expandSuggestionSection('${sectionKey}')">Afficher plus</button>`;
    }
  } else {
    const parts = [];
    if (data.hasMore) {
      parts.push(`<button class="ghost-btn" style="flex:1;" ${data.loadingMore?'disabled':''} onclick="${loadMoreCall}">${data.loadingMore ? 'Chargement...' : 'Charger plus'}</button>`);
    }
    parts.push(`<button class="ghost-btn" style="flex:1;" onclick="collapseSuggestionSection('${sectionKey}')">Afficher moins</button>`);
    buttons = `<div style="display:flex;gap:8px;margin-top:12px;">${parts.join('')}</div>`;
  }
  return grid + buttons;
}

function providersSettingsHtml() {
  if (!state.apiKey) {
    return `<div style="font-size:12.5px;color:var(--muted-dark);">Ajoute d'abord ta clé API TMDB (page Profil) pour voir la liste des plateformes.</div>`;
  }
  if (PROVIDER_LIST_CACHE === 'loading' || PROVIDER_LIST_CACHE === null) {
    return `<div style="font-size:12.5px;color:var(--muted-dark);">Chargement des plateformes...</div>`;
  }
  if (PROVIDER_LIST_CACHE === 'error') {
    return `<div style="font-size:12.5px;color:var(--muted-dark);">Impossible de charger la liste des plateformes pour l'instant.</div>`;
  }
  const q = state.providerSearchQuery.trim().toLowerCase();
  const list = [...PROVIDER_LIST_CACHE]
    .sort((a, b) => {
      const aSel = state.selectedProviderIds.includes(a.provider_id) ? 0 : 1;
      const bSel = state.selectedProviderIds.includes(b.provider_id) ? 0 : 1;
      if (aSel !== bSel) return aSel - bSel;
      const aNetflix = a.provider_name === 'Netflix' ? 0 : 1;
      const bNetflix = b.provider_name === 'Netflix' ? 0 : 1;
      if (aNetflix !== bNetflix) return aNetflix - bNetflix;
      return (a.display_priority || 99) - (b.display_priority || 99);
    })
    .filter((p) => !q || p.provider_name.toLowerCase().includes(q));
  const rows = list.map((p) => {
    const checked = state.selectedProviderIds.includes(p.provider_id);
    const logo = p.logo_path
      ? `<img src="https://image.tmdb.org/t/p/w45${p.logo_path}" style="width:32px;height:32px;border-radius:8px;object-fit:cover;flex-shrink:0;" />`
      : `<div style="width:32px;height:32px;border-radius:8px;background:var(--bg-alt);flex-shrink:0;"></div>`;
    return `<button onclick="toggleProviderSelected(${p.provider_id})" style="display:flex;align-items:center;gap:10px;width:100%;padding:8px 4px;border:none;background:none;cursor:pointer;border-bottom:1px solid var(--border);text-align:left;">
      ${logo}
      <span style="font-size:13px;flex:1;color:${checked?'var(--gold)':'var(--text)'};">${esc(p.provider_name)}</span>
      <span style="width:18px;height:18px;border-radius:5px;border:2px solid ${checked?'var(--gold)':'var(--border)'};background:${checked?'var(--gold)':'none'};display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        ${checked ? `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--bg)" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>` : ''}
      </span>
    </button>`;
  });
  return `
    <div class="search-box" style="margin-bottom:10px;">
      <input id="provider-search-input" placeholder="Rechercher une plateforme..." value="${esc(state.providerSearchQuery)}" oninput="setProviderSearch(this.value)" />
    </div>
    <div style="max-height:380px;overflow-y:auto;">${rows.length ? rows.join('') : `<div style="font-size:12.5px;color:var(--muted-dark);padding:8px 4px;">Aucune plateforme ne correspond.</div>`}</div>
  `;
}
